<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>folder-test</title>
  <style>
    body { margin: 0; font: 12px/1.6 monospace; background: #fff; color: #111 }
    #frame { width: 900px; height: 640px; border: 1px solid #ccc; display: block }
    #log { padding: 8px 10px; white-space: pre-wrap }
  </style>
</head>
<body>
  <p style="font-size:12px;margin:6px 10px">大文件夹分页 / 无字模式 回归测试 ——
    无头运行：<code>chrome --headless=new --allow-file-access-from-files --virtual-time-budget=6000 --dump-dom "tools/folder-test.html?labels=1"</code>，结果写在 &lt;title&gt;。</p>
  <iframe id="frame"></iframe>
  <div id="log"></div>
  <script>
  var Q = new URLSearchParams(location.search)
  var frame = document.getElementById('frame')
  frame.src = '../index.html?theme=dark&labels=' + (Q.get('labels') || '1')
  frame.addEventListener('load', function () { setTimeout(run, 900) })

  function run () {
    var out = []
    function ok (n, c, x) { out.push((c ? 'PASS' : 'FAIL') + ':' + n + (x !== undefined ? '[' + x + ']' : '')) }
    try {
      var W = frame.contentWindow, D = frame.contentDocument, KL = W.KL
      if (!KL || !KL.grid || !KL.store) { out.push('ERROR:KL 未加载'); return finish(out) }
      var labels = Q.get('labels') !== '0'
      var ICON_RATIO_TEST = 0.72   // 和 js/grid.js 里的 ICON_RATIO 保持一致

      var folder = null
      KL.store.shortcuts.forEach(function (s) {
        if (!folder && s.kind === 'folder' && s.col * s.row > 1) folder = s
      })
      if (!folder) { out.push('ERROR:mock 里没有大文件夹'); return finish(out) }

      var tile = D.querySelector('.tile.folder-big[data-id="' + folder.id + '"]')
      ok('大文件夹渲染', !!tile)
      if (!tile) return finish(out)

      var inner = tile.querySelector('.folder-inner')
      ok('folder-inner 存在', !!inner)
      if (!inner) return finish(out)

      var mCols = 0, mUnit = 0
      var m1 = inner.style.gridTemplateColumns.match(/repeat\((\d+),\s*(\d+)px\)/)
      if (m1) { mCols = parseInt(m1[1], 10); mUnit = parseInt(m1[2], 10) }
      ok('显式列数 ≥1', mCols >= 1, inner.style.gridTemplateColumns)
      var rowH = parseInt(inner.style.gridAutoRows, 10)
      ok('行高为显式像素', rowH > 0, inner.style.gridAutoRows)

      var firstTile = inner.querySelector('.inner-tile')
      var iconSize = firstTile ? parseInt(firstTile.style.getPropertyValue('--icon-size'), 10) : 0
      ok('图标尺寸合法(0<icon≤unit)', iconSize > 0 && iconSize <= mUnit, iconSize + '/' + mUnit)

      var overflowY = W.getComputedStyle(inner).overflowY
      ok('内部不出现滚动条（overflow:hidden）', overflowY === 'hidden', overflowY)

      // 文件夹标题现在是**格子下方的 .label**（和图标名称同一套逻辑），带名称 + 数量
      function folderLabelOf (tl) {
        var found = null
        Array.prototype.forEach.call(tl.children, function (c) {
          if (c.classList.contains('label')) found = c
        })
        return found
      }
      var flabel = folderLabelOf(tile)
      ok('文件夹标题是格子外的 label', !!flabel)
      var nameEl = flabel ? flabel.querySelector('.label-name') : null
      ok('标题里是文件夹名称', !!nameEl && nameEl.textContent === folder.name,
        nameEl ? JSON.stringify(nameEl.textContent) : '无')
      var cntEl = flabel ? flabel.querySelector('.label-count') : null
      ok('标题里带数量', !!cntEl, cntEl ? cntEl.textContent : '无')
      if (labels) {
        ok('标题在文件夹格子下方',
          flabel && flabel.getBoundingClientRect().top >= tile.getBoundingClientRect().bottom - 1,
          flabel ? Math.round(flabel.getBoundingClientRect().top) + ' vs ' + Math.round(tile.getBoundingClientRect().bottom) : '无')
      } else {
        // 无字模式下和图标名称一样隐藏（同等的显示逻辑），所以不看位置
        ok('无字模式文件夹标题与图标名称一样隐藏',
          !!flabel && W.getComputedStyle(flabel).display === 'none',
          flabel ? W.getComputedStyle(flabel).display : '无 label')
      }
      ok('不再有内嵌标题栏 / 右上角角标',
        !tile.querySelector('.folder-head') && !tile.querySelector('.folder-badge'))

      /* ---- 内部图标一律不显示名称（两种模式都是） ---- */
      ok('内部图标不渲染名称元素', !inner.querySelector('.inner-tile .label'))
      ok('内部图标节点无文本', firstTile ? firstTile.textContent.trim() === '' : false,
        JSON.stringify(firstTile ? firstTile.textContent : null))
      // 行高以前是 unit + 22（名称行），现在不再为名称留位置
      ok('行高不再为名称留位置', rowH === mUnit, 'rowH=' + rowH + ' unit=' + mUnit)

      /* ---- 内部格子的外观跟主网格同一套设置项 ---- */
      var savedStyle = {
        tileBgColor: KL.store.settings.tileBgColor,
        tileBgOpacity: KL.store.settings.tileBgOpacity,
        tileBorderColor: KL.store.settings.tileBorderColor,
        tileBorderWidth: KL.store.settings.tileBorderWidth,
        tileRadius: KL.store.settings.tileRadius
      }
      KL.store.setSetting('tileBgColor', '#ff8800')
      KL.store.setSetting('tileBgOpacity', 100)
      KL.store.setSetting('tileBorderColor', '#22ff44')
      KL.store.setSetting('tileBorderWidth', 3)
      KL.store.setSetting('tileRadius', 20)
      // 这几项在真实使用里由设置面板直接把 CSS 变量写到 :root 上（见 dialogs.js）；
      // setSetting 本身不会更新变量，所以这里补一次 applyVars。
      KL.app.applyVars()
      // setSetting 会触发重渲染，旧的 tile 引用会变成游离节点（getComputedStyle 读出来是空串）
      // —— 所以这里必须重新查询
      var innerCell = D.querySelector('.tile.folder-big .inner-tile')
      var mainCell = D.querySelector('.grid > .tile:not(.folder)')
      var ci = W.getComputedStyle(innerCell)
      var cm = W.getComputedStyle(mainCell)
      ok('内部格子与主网格同一圆角', ci.borderTopLeftRadius === cm.borderTopLeftRadius,
        ci.borderTopLeftRadius + ' vs ' + cm.borderTopLeftRadius)
      ok('内部格子与主网格同一描边宽度', ci.borderTopWidth === cm.borderTopWidth,
        ci.borderTopWidth + ' vs ' + cm.borderTopWidth)
      ok('内部格子与主网格同一描边颜色', ci.borderTopColor === cm.borderTopColor,
        ci.borderTopColor + ' vs ' + cm.borderTopColor)
      ok('内部格子与主网格同一背景色', ci.backgroundColor === cm.backgroundColor,
        ci.backgroundColor + ' vs ' + cm.backgroundColor)
      // 真值检查：确认设置真的生效了（不是两边都透明）
      ok('内部格子真的用上了设置的背景', ci.backgroundColor === 'rgb(255, 136, 0)',
        ci.backgroundColor)
      ok('内部格子真的用上了设置的描边',
        ci.borderTopWidth === '3px' && ci.borderTopColor === 'rgb(34, 255, 68)',
        ci.borderTopWidth + ' / ' + ci.borderTopColor)
      ok('内部格子真的用上了设置的圆角', ci.borderTopLeftRadius === '20px', ci.borderTopLeftRadius)

      // 还原，免得影响后面的断言和截图
      KL.store.setSetting('tileBgColor', savedStyle.tileBgColor)
      KL.store.setSetting('tileBgOpacity', savedStyle.tileBgOpacity)
      KL.store.setSetting('tileBorderColor', savedStyle.tileBorderColor)
      KL.store.setSetting('tileBorderWidth', savedStyle.tileBorderWidth)
      KL.store.setSetting('tileRadius', savedStyle.tileRadius)
      KL.app.applyVars()
      var innerCell2 = D.querySelector('.tile.folder-big .inner-tile')
      var mainCell2 = D.querySelector('.grid > .tile:not(.folder)')
      ok('还原后内部格子与主网格依然一致',
        W.getComputedStyle(innerCell2).borderTopWidth === W.getComputedStyle(mainCell2).borderTopWidth &&
        W.getComputedStyle(innerCell2).backgroundColor === W.getComputedStyle(mainCell2).backgroundColor,
        W.getComputedStyle(innerCell2).borderTopWidth + ' / ' + W.getComputedStyle(innerCell2).backgroundColor)

      // 塞 40 个子项撑出多页
      var kid0 = KL.store.childrenOf(folder.id)[0]
      for (var i = 0; i < 40; i++) {
        KL.store.shortcuts.push(Object.assign({}, kid0, { id: 'tk' + (Date.now()) + '_' + i, name: '测试项 ' + i }))
      }
      var kidTotal = KL.store.childrenOf(folder.id).length
      KL.grid.render()
      tile = D.querySelector('.tile.folder-big[data-id="' + folder.id + '"]')
      inner = tile.querySelector('.folder-inner')
      rowH = parseInt(inner.style.gridAutoRows, 10)
      var mGap = parseInt(inner.style.gap, 10)
      var mRows = Math.max(1, Math.floor((inner.clientHeight + mGap) / (rowH + mGap)))
      var pageCap = mCols * mRows
      var pages = Math.ceil(kidTotal / pageCap)

      /* ---- 分页：每页整 rows × cols 个，且**没有页标** ---- */
      ok('不渲染分页器',
        !tile.querySelector('.folder-pager') && !D.querySelector('.folder-pager'))
      ok('每页容量 > 0 且确实需要多页', pageCap > 0 && pages > 1,
        'pageCap=' + pageCap + ' pages=' + pages + ' kids=' + kidTotal)

      // 每个内部图标要么完整可见、要么完全在视野外（分页只渲染整行）
      function clippedCount () {
        var ir = inner.getBoundingClientRect()
        var n = 0
        Array.prototype.forEach.call(inner.querySelectorAll('.inner-tile'), function (t2) {
          var r = t2.getBoundingClientRect()
          var vis = Math.min(r.bottom, ir.bottom) - Math.max(r.top, ir.top)
          if (vis > 1 && vis < r.height - 1) n++
        })
        return n
      }
      function rendered () { return inner.querySelectorAll('.inner-tile').length }
      function firstId () {
        var t2 = inner.querySelector('.inner-tile')
        return t2 ? t2.dataset.id : ''
      }
      function wheel (dy) {
        var ev = new W.WheelEvent('wheel', { deltaY: dy, cancelable: true, bubbles: true })
        inner.dispatchEvent(ev)
        return ev
      }

      ok('第一页只渲染一页的量', rendered() === Math.min(kidTotal, pageCap),
        rendered() + '/' + Math.min(kidTotal, pageCap))
      ok('只渲染整行（每行都是完整的）', rendered() % mCols === 0, rendered() + ' 列=' + mCols)
      ok('第一页没有图标被裁', clippedCount() === 0, 'clipped=' + clippedCount())

      var id0 = firstId()
      var ev1 = wheel(120)
      ok('滚轮向下翻一页', firstId() !== id0 && ev1.defaultPrevented,
        id0 + '→' + firstId() + ' prevented=' + ev1.defaultPrevented)
      ok('翻页后仍然只渲染整行', rendered() % mCols === 0, rendered() + ' 列=' + mCols)
      ok('翻页后没有图标被裁', clippedCount() === 0, 'clipped=' + clippedCount())

      var evBack = wheel(-120)
      ok('滚轮向上翻回上一页', firstId() === id0, firstId())
      ok('第一页再向上滚 → 放行给外层', wheel(-120).defaultPrevented === false)

      // 一路翻到最后一页
      var guard = 0
      var beforeLast = ''
      while (guard++ < 100) {
        beforeLast = firstId()
        var e3 = wheel(120)
        if (!e3.defaultPrevented) break
      }
      ok('能翻到最后一页', beforeLast !== '', beforeLast)
      ok('到最后一页后再滚内容不变', (function () {
        var a = firstId()
        wheel(120)
        return firstId() === a
      })())
      ok('最后一页最后一行可能不满，但没有图标被裁',
        clippedCount() === 0, 'clipped=' + clippedCount() + ' rendered=' + rendered())
      ok('最后一页没有图标被裁', clippedCount() === 0, 'clipped=' + clippedCount())
      ok('最后一页数量正确', rendered() === kidTotal - (pages - 1) * pageCap,
        rendered() + ' vs ' + (kidTotal - (pages - 1) * pageCap))

      // 翻回第一页（向上滚到底）
      var guard2 = 0
      while (guard2++ < 100) {
        var e4 = wheel(-120)
        if (!e4.defaultPrevented) break
      }
      ok('能翻回第一页', firstId() === id0, firstId())

      // 无字模式下文件夹名称与图标名称一样隐藏（翻页只换内部内容，名称不受影响）
      if (!labels) {
        var fl3 = folderLabelOf(tile)
        ok('无字模式下文件夹名称与图标名称一样隐藏',
          !!fl3 && W.getComputedStyle(fl3).display === 'none',
          fl3 ? W.getComputedStyle(fl3).display : '无 label')
      }

      /* ---- 每个文件夹的「内部显示方式」：列表 ---- */
      var gridRowH = parseInt(inner.style.gridAutoRows, 10)
      var firstName = KL.store.childrenOf(folder.id)[0].name

      KL.store.updateShortcut(folder.id, { folderView: 'list' })
      KL.grid.render()
      tile = D.querySelector('.tile.folder-big[data-id="' + folder.id + '"]')
      inner = tile.querySelector('.folder-inner')
      var row0 = inner.querySelector('.inner-tile')
      var listRowH = parseInt(inner.style.gridAutoRows, 10)
      var listCount = inner.querySelectorAll('.inner-tile').length
      var nameEl = row0 ? row0.querySelector('.inner-name') : null

      ok('列表模式：内部单列', inner.style.gridTemplateColumns === '1fr', inner.style.gridTemplateColumns)
      ok('列表模式：文件夹带 folder-list 标记', tile.classList.contains('folder-list'), tile.className)
      ok('列表模式：内部项打上 list-row', !!row0 && row0.classList.contains('list-row'),
        row0 ? row0.className : '无')
      ok('列表模式：每行显示名称', !!nameEl && nameEl.textContent === firstName,
        nameEl ? nameEl.textContent : '无')
      ok('列表模式：行高比网格行矮（图标缩到 55%）', listRowH < gridRowH, listRowH + ' < ' + gridRowH)
      ok('列表模式：一页有内容', listCount > 0, String(listCount))
      if (row0) {
        var rr = row0.getBoundingClientRect()
        var icr = row0.querySelector('.icon-box').getBoundingClientRect()
        var nrr = nameEl.getBoundingClientRect()
        ok('列表模式：图标贴左边', icr.left - rr.left <= 10, Math.round(icr.left - rr.left))
        ok('列表模式：名称在图标右侧', nrr.left >= icr.right - 2,
          Math.round(nrr.left) + ' vs ' + Math.round(icr.right))
        ok('列表模式：名称在行内部', nrr.right <= rr.right + 1 && nrr.top >= rr.top - 1,
          'name ' + Math.round(nrr.left) + '..' + Math.round(nrr.right) +
          ' row ' + Math.round(rr.left) + '..' + Math.round(rr.right))
        ok('列表模式：行铺满内部宽度', rr.width >= inner.getBoundingClientRect().width - 2,
          Math.round(rr.width) + ' vs ' + Math.round(inner.getBoundingClientRect().width))
      }

      // 切回图标模式
      KL.store.updateShortcut(folder.id, { folderView: 'grid' })
      KL.grid.render()
      tile = D.querySelector('.tile.folder-big[data-id="' + folder.id + '"]')
      inner = tile.querySelector('.folder-inner')
      ok('切回图标模式：列模板恢复', /^repeat\(/.test(inner.style.gridTemplateColumns),
        inner.style.gridTemplateColumns)
      ok('切回图标模式：不再有 list-row', !inner.querySelector('.list-row'))
      ok('切回图标模式：行高恢复', parseInt(inner.style.gridAutoRows, 10) === gridRowH,
        inner.style.gridAutoRows)

      /* ---- 点击大文件夹"任意空白处" = 打开文件夹 ----
         用 modalCount 判断（同步增减），别用 .fv-grid 是否存在 ——
         关闭时有 120ms 的退场动画，DOM 还在。 */
      function closeModal () {
        // 关闭有 120ms 退场动画，DOM 里可能同时挂着上一个已关闭的弹窗 ——
        // 必须点最后一个（最新打开的那个），否则点到已经 closed 的按钮上是空操作
        var btns = D.querySelectorAll('.modal-head button[title="关闭"]')
        if (btns.length) btns[btns.length - 1].click()
      }
      var base = KL.ui.modalCount

      // ① 事件目标是文件夹本体（外圈留白）
      tile.dispatchEvent(new W.MouseEvent('click', { bubbles: true }))
      ok('点文件夹空白处打开视图',
        KL.ui.modalCount === base + 1 && !!D.querySelector('.fv-grid'),
        'modal ' + base + '→' + KL.ui.modalCount)
      closeModal()

      // ② 事件目标是内部网格容器（图标之间的空隙）
      inner.dispatchEvent(new W.MouseEvent('click', { bubbles: true }))
      ok('点内部空隙也打开视图', KL.ui.modalCount === base + 1, 'modal=' + KL.ui.modalCount)
      closeModal()

      // ③ 点文件夹名称（格子下方那个 label）也打开
      var fl2 = folderLabelOf(tile)
      if (fl2) {
        fl2.dispatchEvent(new W.MouseEvent('click', { bubbles: true }))
        ok('点文件夹名称打开文件夹', KL.ui.modalCount === base + 1, 'modal=' + KL.ui.modalCount)
        closeModal()
      } else {
        ok('点文件夹名称打开文件夹', false, '找不到 label')
      }

      // ④ 点内部图标 = 启动该项，不是打开文件夹（放最后：启动会触发重渲染）
      var it = null
      Array.prototype.forEach.call(inner.querySelectorAll('.inner-tile'), function (t2) {
        var s2 = KL.store.getShortcut(t2.dataset.id)
        if (!it && s2 && s2.launch && s2.launch.kind !== 'url') it = t2
      })
      if (it) {
        try { it.dispatchEvent(new W.MouseEvent('click', { bubbles: true })) } catch (e2) {}
        ok('点内部图标不打开文件夹', KL.ui.modalCount === base, 'modal=' + KL.ui.modalCount)
      }

      /* ---- 只有一页时滚轮不能被拦（要让外层页面照常滚） ---- */
      KL.store.batch(function () {
        KL.store.childrenOf(folder.id).slice(4).forEach(function (k) { KL.store.removeShortcut(k.id) })
      })
      var tile4 = D.querySelector('.tile.folder-big[data-id="' + folder.id + '"]')
      var inner4 = tile4.querySelector('.folder-inner')
      var kids4 = KL.store.childrenOf(folder.id).length
      var shown4 = inner4.querySelectorAll('.inner-tile').length
      var evFit = new W.WheelEvent('wheel', { deltaY: 120, cancelable: true, bubbles: true })
      inner4.dispatchEvent(evFit)
      ok('只有一页时全部渲染、且滚轮不被消费',
        shown4 === kids4 && evFit.defaultPrevented === false,
        'shown=' + shown4 + '/' + kids4 + ' prevented=' + evFit.defaultPrevented)
      ok('收尾时也没有分页器', !D.querySelector('.folder-pager'))

      /* ---- 右键菜单里有「内部显示方式」 ---- */
      var bigTile = D.querySelector('.tile.folder-big[data-id="' + folder.id + '"]')
      bigTile.dispatchEvent(new W.MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: 300, clientY: 300 }))
      var menuTxt = D.body.textContent || ''
      ok('大文件夹右键菜单有「内部显示方式」', menuTxt.indexOf('内部显示方式') >= 0)
      ok('菜单里有「列表」选项', menuTxt.indexOf('列表（图标 + 名称）') >= 0)
      KL.ui.closeMenu()
      ok('菜单已关闭', !D.querySelector('.ctx.show'))

      var mini = null
      KL.store.shortcuts.forEach(function (s2) { if (!mini && s2.kind === 'folder' && s2.col * s2.row <= 1) mini = s2 })
      if (mini) {
        var miniTile = D.querySelector('.tile[data-id="' + mini.id + '"]')
        miniTile.dispatchEvent(new W.MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: 300, clientY: 300 }))
        ok('小文件夹菜单里没有「内部显示方式」', (D.body.textContent || '').indexOf('内部显示方式') < 0)
        KL.ui.closeMenu()
      }

      /* ---- 内部图标与格子的比例：必须和主网格一致（72%）----
         以前内部格子是「图标 + 8px 内衬」挤出来的，图标占了格子近 9 成，
         格子紧紧箍着图标（加了描边之后特别明显）。 */
      var savedFolderScale = KL.store.settings.folderIconSize
      KL.store.updateShortcut(folder.id, { folderView: 'grid' })
      KL.store.setSetting('folderIconSize', savedFolderScale)
      var tR = D.querySelector('.tile.folder-big[data-id="' + folder.id + '"]')
      var iR = tR.querySelector('.folder-inner')
      var unitR = parseInt(/repeat\(\d+,\s*(\d+)px\)/.exec(iR.style.gridTemplateColumns)[1], 10)
      var iconR = parseInt(iR.querySelector('.inner-tile').style.getPropertyValue('--icon-size'), 10)
      // 拿一个 1×1 的普通图标做基准（2×2 的 tile 图标会更大，不能直接比）
      var mtR = null
      Array.prototype.forEach.call(D.querySelectorAll('.grid > .tile:not(.folder)'), function (t2) {
        if (mtR) return
        if (String(t2.style.gridRow).indexOf('span 1') === 0 &&
            String(t2.style.gridColumn).indexOf('span 1') === 0) mtR = t2
      })
      var mainIcon = parseInt(mtR.style.getPropertyValue('--icon-size'), 10)
      var cellR = KL.grid.gridMetrics().cell
      ok('主网格图标与格子是 72%', Math.abs(mainIcon / cellR - ICON_RATIO_TEST) <= 0.02,
        Math.round(mainIcon / cellR * 100) + '% (' + mainIcon + '/' + cellR + ')')
      ok('内部图标与格子的比例也是 72%', Math.abs(iconR / unitR - ICON_RATIO_TEST) <= 0.02,
        Math.round(iconR / unitR * 100) + '% (' + iconR + '/' + unitR + ')')
      ok('内部图标没有被格子箍满（留出内边距）', iconR / unitR < 0.8,
        Math.round(iconR / unitR * 100) + '%')

      // 「与主格一致」时，内外的格子和图标应该完全一样
      KL.store.setSetting('folderIconSize', 'same')
      var tS = D.querySelector('.tile.folder-big[data-id="' + folder.id + '"]')
      var iS = tS.querySelector('.folder-inner')
      var unitS = parseInt(/repeat\(\d+,\s*(\d+)px\)/.exec(iS.style.gridTemplateColumns)[1], 10)
      var iconS = parseInt(iS.querySelector('.inner-tile').style.getPropertyValue('--icon-size'), 10)
      ok('「与主格一致」时内部格子 = 主网格格子', unitS === cellR, unitS + ' vs ' + cellR)
      ok('「与主格一致」时内部图标 = 主网格图标', iconS === mainIcon, iconS + ' vs ' + mainIcon)
      KL.store.setSetting('folderIconSize', savedFolderScale)
    } catch (e) {
      out.push('ERROR:' + (e && e.message))
    }
    finish(out)
  }

  function finish (out) {
    var failed = 0
    out.forEach(function (l) { if (l.indexOf('PASS') !== 0) failed++ })
    var txt = (failed ? ('FAILED ' + failed + ' | ') : 'ALL PASS | ') + out.join('  ')
    document.getElementById('log').textContent = txt
    document.title = txt
  }
  </script>
</body>
</html>
