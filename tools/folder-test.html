<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>folder-test</title>
  <style>
    body { margin: 0; font: 12px/1.6 monospace; background: #fff; color: #111 }
    #frame { width: 900px; height: 640px; border: 1px solid #ccc; display: block }
    #log { padding: 8px 10px; white-space: pre-wrap }
  </style>
</head>
<body>
  <p style="font-size:12px;margin:6px 10px">大文件夹分页 / 无字模式 回归测试 ——
    无头运行：<code>chrome --headless=new --allow-file-access-from-files --virtual-time-budget=6000 --dump-dom "tools/folder-test.html?labels=1"</code>，结果写在 &lt;title&gt;。</p>
  <iframe id="frame"></iframe>
  <div id="log"></div>
  <script>
  var Q = new URLSearchParams(location.search)
  var frame = document.getElementById('frame')
  frame.src = '../index.html?theme=dark&labels=' + (Q.get('labels') || '1')
  frame.addEventListener('load', function () { setTimeout(run, 900) })

  function run () {
    var out = []
    function ok (n, c, x) { out.push((c ? 'PASS' : 'FAIL') + ':' + n + (x !== undefined ? '[' + x + ']' : '')) }
    try {
      var W = frame.contentWindow, D = frame.contentDocument, KL = W.KL
      if (!KL || !KL.grid || !KL.store) { out.push('ERROR:KL 未加载'); return finish(out) }
      var labels = Q.get('labels') !== '0'

      var folder = null
      KL.store.shortcuts.forEach(function (s) {
        if (!folder && s.kind === 'folder' && s.col * s.row > 1) folder = s
      })
      if (!folder) { out.push('ERROR:mock 里没有大文件夹'); return finish(out) }

      var tile = D.querySelector('.tile.folder-big[data-id="' + folder.id + '"]')
      ok('大文件夹渲染', !!tile)
      if (!tile) return finish(out)

      var inner = tile.querySelector('.folder-inner')
      ok('folder-inner 存在', !!inner)
      if (!inner) return finish(out)

      var mCols = 0, mUnit = 0
      var m1 = inner.style.gridTemplateColumns.match(/repeat\((\d+),\s*(\d+)px\)/)
      if (m1) { mCols = parseInt(m1[1], 10); mUnit = parseInt(m1[2], 10) }
      ok('显式列数 ≥1', mCols >= 1, inner.style.gridTemplateColumns)
      var rowH = parseInt(inner.style.gridAutoRows, 10)
      ok('行高为显式像素', rowH > 0, inner.style.gridAutoRows)

      var firstTile = inner.querySelector('.inner-tile')
      var iconSize = firstTile ? parseInt(firstTile.style.getPropertyValue('--icon-size'), 10) : 0
      ok('图标尺寸合法(0<icon≤unit)', iconSize > 0 && iconSize <= mUnit, iconSize + '/' + mUnit)

      var overflowY = W.getComputedStyle(inner).overflowY
      ok('内部不出现滚动条（overflow:hidden）', overflowY === 'hidden', overflowY)

      // 文件夹标题现在是**格子下方的 .label**（和图标名称同一套逻辑），带名称 + 数量
      function folderLabelOf (tl) {
        var found = null
        Array.prototype.forEach.call(tl.children, function (c) {
          if (c.classList.contains('label')) found = c
        })
        return found
      }
      var flabel = folderLabelOf(tile)
      ok('文件夹标题是格子外的 label', !!flabel)
      var nameEl = flabel ? flabel.querySelector('.label-name') : null
      ok('标题里是文件夹名称', !!nameEl && nameEl.textContent === folder.name,
        nameEl ? JSON.stringify(nameEl.textContent) : '无')
      var cntEl = flabel ? flabel.querySelector('.label-count') : null
      ok('标题里带数量', !!cntEl, cntEl ? cntEl.textContent : '无')
      if (labels) {
        ok('标题在文件夹格子下方',
          flabel && flabel.getBoundingClientRect().top >= tile.getBoundingClientRect().bottom - 1,
          flabel ? Math.round(flabel.getBoundingClientRect().top) + ' vs ' + Math.round(tile.getBoundingClientRect().bottom) : '无')
      } else {
        // 无字模式下和图标名称一样隐藏（同等的显示逻辑），所以不看位置
        ok('无字模式文件夹标题与图标名称一样隐藏',
          !!flabel && W.getComputedStyle(flabel).display === 'none',
          flabel ? W.getComputedStyle(flabel).display : '无 label')
      }
      ok('不再有内嵌标题栏 / 右上角角标',
        !tile.querySelector('.folder-head') && !tile.querySelector('.folder-badge'))

      /* ---- 内部图标一律不显示名称（两种模式都是） ---- */
      ok('内部图标不渲染名称元素', !inner.querySelector('.inner-tile .label'))
      ok('内部图标节点无文本', firstTile ? firstTile.textContent.trim() === '' : false,
        JSON.stringify(firstTile ? firstTile.textContent : null))
      // 行高以前是 unit + 22（名称行），现在不再为名称留位置
      ok('行高不再为名称留位置', rowH === mUnit, 'rowH=' + rowH + ' unit=' + mUnit)

      // 塞 40 个子项撑出多页
      var kid0 = KL.store.childrenOf(folder.id)[0]
      for (var i = 0; i < 40; i++) {
        KL.store.shortcuts.push(Object.assign({}, kid0, { id: 'tk' + (Date.now()) + '_' + i, name: '测试项 ' + i }))
      }
      var kidTotal = KL.store.childrenOf(folder.id).length
      KL.grid.render()
      tile = D.querySelector('.tile.folder-big[data-id="' + folder.id + '"]')
      inner = tile.querySelector('.folder-inner')
      rowH = parseInt(inner.style.gridAutoRows, 10)
      var mGap = parseInt(inner.style.gap, 10)
      var mRows = Math.max(1, Math.floor((inner.clientHeight + mGap) / (rowH + mGap)))
      var pageCap = mCols * mRows
      var pages = Math.ceil(kidTotal / pageCap)

      /* ---- 分页：每页整 rows × cols 个，且**没有页标** ---- */
      ok('不渲染分页器',
        !tile.querySelector('.folder-pager') && !D.querySelector('.folder-pager'))
      ok('每页容量 > 0 且确实需要多页', pageCap > 0 && pages > 1,
        'pageCap=' + pageCap + ' pages=' + pages + ' kids=' + kidTotal)

      // 每个内部图标要么完整可见、要么完全在视野外（分页只渲染整行）
      function clippedCount () {
        var ir = inner.getBoundingClientRect()
        var n = 0
        Array.prototype.forEach.call(inner.querySelectorAll('.inner-tile'), function (t2) {
          var r = t2.getBoundingClientRect()
          var vis = Math.min(r.bottom, ir.bottom) - Math.max(r.top, ir.top)
          if (vis > 1 && vis < r.height - 1) n++
        })
        return n
      }
      function rendered () { return inner.querySelectorAll('.inner-tile').length }
      function firstId () {
        var t2 = inner.querySelector('.inner-tile')
        return t2 ? t2.dataset.id : ''
      }
      function wheel (dy) {
        var ev = new W.WheelEvent('wheel', { deltaY: dy, cancelable: true, bubbles: true })
        inner.dispatchEvent(ev)
        return ev
      }

      ok('第一页只渲染一页的量', rendered() === Math.min(kidTotal, pageCap),
        rendered() + '/' + Math.min(kidTotal, pageCap))
      ok('只渲染整行（每行都是完整的）', rendered() % mCols === 0, rendered() + ' 列=' + mCols)
      ok('第一页没有图标被裁', clippedCount() === 0, 'clipped=' + clippedCount())

      var id0 = firstId()
      var ev1 = wheel(120)
      ok('滚轮向下翻一页', firstId() !== id0 && ev1.defaultPrevented,
        id0 + '→' + firstId() + ' prevented=' + ev1.defaultPrevented)
      ok('翻页后仍然只渲染整行', rendered() % mCols === 0, rendered() + ' 列=' + mCols)
      ok('翻页后没有图标被裁', clippedCount() === 0, 'clipped=' + clippedCount())

      var evBack = wheel(-120)
      ok('滚轮向上翻回上一页', firstId() === id0, firstId())
      ok('第一页再向上滚 → 放行给外层', wheel(-120).defaultPrevented === false)

      // 一路翻到最后一页
      var guard = 0
      var beforeLast = ''
      while (guard++ < 100) {
        beforeLast = firstId()
        var e3 = wheel(120)
        if (!e3.defaultPrevented) break
      }
      ok('能翻到最后一页', beforeLast !== '', beforeLast)
      ok('到最后一页后再滚内容不变', (function () {
        var a = firstId()
        wheel(120)
        return firstId() === a
      })())
      ok('最后一页最后一行可能不满，但没有图标被裁',
        clippedCount() === 0, 'clipped=' + clippedCount() + ' rendered=' + rendered())
      ok('最后一页没有图标被裁', clippedCount() === 0, 'clipped=' + clippedCount())
      ok('最后一页数量正确', rendered() === kidTotal - (pages - 1) * pageCap,
        rendered() + ' vs ' + (kidTotal - (pages - 1) * pageCap))

      // 翻回第一页（向上滚到底）
      var guard2 = 0
      while (guard2++ < 100) {
        var e4 = wheel(-120)
        if (!e4.defaultPrevented) break
      }
      ok('能翻回第一页', firstId() === id0, firstId())

      // 无字模式下文件夹名称与图标名称一样隐藏（翻页只换内部内容，名称不受影响）
      if (!labels) {
        var fl3 = folderLabelOf(tile)
        ok('无字模式下文件夹名称与图标名称一样隐藏',
          !!fl3 && W.getComputedStyle(fl3).display === 'none',
          fl3 ? W.getComputedStyle(fl3).display : '无 label')
      }

      /* ---- 点击大文件夹"任意空白处" = 打开文件夹 ----
         用 modalCount 判断（同步增减），别用 .fv-grid 是否存在 ——
         关闭时有 120ms 的退场动画，DOM 还在。 */
      function closeModal () {
        // 关闭有 120ms 退场动画，DOM 里可能同时挂着上一个已关闭的弹窗 ——
        // 必须点最后一个（最新打开的那个），否则点到已经 closed 的按钮上是空操作
        var btns = D.querySelectorAll('.modal-head button[title="关闭"]')
        if (btns.length) btns[btns.length - 1].click()
      }
      var base = KL.ui.modalCount

      // ① 事件目标是文件夹本体（外圈留白）
      tile.dispatchEvent(new W.MouseEvent('click', { bubbles: true }))
      ok('点文件夹空白处打开视图',
        KL.ui.modalCount === base + 1 && !!D.querySelector('.fv-grid'),
        'modal ' + base + '→' + KL.ui.modalCount)
      closeModal()

      // ② 事件目标是内部网格容器（图标之间的空隙）
      inner.dispatchEvent(new W.MouseEvent('click', { bubbles: true }))
      ok('点内部空隙也打开视图', KL.ui.modalCount === base + 1, 'modal=' + KL.ui.modalCount)
      closeModal()

      // ③ 点文件夹名称（格子下方那个 label）也打开
      var fl2 = folderLabelOf(tile)
      if (fl2) {
        fl2.dispatchEvent(new W.MouseEvent('click', { bubbles: true }))
        ok('点文件夹名称打开文件夹', KL.ui.modalCount === base + 1, 'modal=' + KL.ui.modalCount)
        closeModal()
      } else {
        ok('点文件夹名称打开文件夹', false, '找不到 label')
      }

      // ④ 点内部图标 = 启动该项，不是打开文件夹（放最后：启动会触发重渲染）
      var it = null
      Array.prototype.forEach.call(inner.querySelectorAll('.inner-tile'), function (t2) {
        var s2 = KL.store.getShortcut(t2.dataset.id)
        if (!it && s2 && s2.launch && s2.launch.kind !== 'url') it = t2
      })
      if (it) {
        try { it.dispatchEvent(new W.MouseEvent('click', { bubbles: true })) } catch (e2) {}
        ok('点内部图标不打开文件夹', KL.ui.modalCount === base, 'modal=' + KL.ui.modalCount)
      }

      /* ---- 只有一页时滚轮不能被拦（要让外层页面照常滚） ---- */
      KL.store.batch(function () {
        KL.store.childrenOf(folder.id).slice(4).forEach(function (k) { KL.store.removeShortcut(k.id) })
      })
      var tile4 = D.querySelector('.tile.folder-big[data-id="' + folder.id + '"]')
      var inner4 = tile4.querySelector('.folder-inner')
      var kids4 = KL.store.childrenOf(folder.id).length
      var shown4 = inner4.querySelectorAll('.inner-tile').length
      var evFit = new W.WheelEvent('wheel', { deltaY: 120, cancelable: true, bubbles: true })
      inner4.dispatchEvent(evFit)
      ok('只有一页时全部渲染、且滚轮不被消费',
        shown4 === kids4 && evFit.defaultPrevented === false,
        'shown=' + shown4 + '/' + kids4 + ' prevented=' + evFit.defaultPrevented)
      ok('收尾时也没有分页器', !D.querySelector('.folder-pager'))
    } catch (e) {
      out.push('ERROR:' + (e && e.message))
    }
    finish(out)
  }

  function finish (out) {
    var failed = 0
    out.forEach(function (l) { if (l.indexOf('PASS') !== 0) failed++ })
    var txt = (failed ? ('FAILED ' + failed + ' | ') : 'ALL PASS | ') + out.join('  ')
    document.getElementById('log').textContent = txt
    document.title = txt
  }
  </script>
</body>
</html>
